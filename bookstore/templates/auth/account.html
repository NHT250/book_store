{% extends "base.html" %}
{% block title %}My account{% endblock %}
{% block content %}
<section class="card form-card">
  <h1>My account</h1>
  <dl class="meta">
    <dt>Name</dt><dd>{{ g.user.full_name }}</dd>
    <dt>Email</dt><dd>{{ g.user.email }}</dd>
    <dt>Role</dt><dd>{{ 'Administrator' if g.user.role == 'ADMIN' else 'Customer' }}</dd>
    <dt>Status</dt><dd><span class="badge badge-ok">{{ g.user.status }}</span></dd>
  </dl>
  <a class="btn btn-ghost" href="{{ url_for('catalog.index') }}">Back to books</a>
</section>
{% endblock %}
